name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: 单元测试与语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-gateway.txt
      - name: 安装依赖
        run: |
          pip install -r requirements-gateway.txt pytest
          # rapidocr-onnxruntime 会拉入 GUI 版 opencv-python（依赖 libxcb），
          # 在 CI/容器无 X11 的环境下 import cv2 会失败；强制回退 headless 版，
          # 与 docker/Dockerfile.gateway 保持一致。
          pip uninstall -y opencv-python 2>/dev/null || true
          pip install --force-reinstall opencv-python-headless==4.10.0.84
      - name: 语法编译
        run: python -m compileall -q gateway semantic shared scripts
      - name: 单元测试
        run: python -m pytest tests/unit -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 构建
        working-directory: frontend
        run: pnpm build

  compose:
    name: 编排配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 用示例配置解析 compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  compliance:
    name: 开源合规自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 无密钥 / 无私有链接 / 无本机绝对路径
        run: bash scripts/preflight-opensource.sh

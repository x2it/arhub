name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说场景与痛点，再说你想要的方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的接口 / 界面 / 行为；如有参考实现请给链接
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 检索与语义
        - 扫描增强 / 采集
        - 安全 / 权限 / 密级 / 审计
        - 运维 / 备份 / 部署
        - Web 工作台
        - 文档 / 国际化
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: contrib
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现它
          required: false
